# Runs the importer's tests, then builds its image and publishes it to GitHub's container registry.
name: Build importer image

on:
  push:
    branches: [jeff]
    paths:
      - "importer/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # tests that need the private DROPS fixtures skip themselves

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: importer
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/knit-import:latest
            ghcr.io/${{ github.repository_owner }}/knit-import:sha-${{ github.sha }}
